# GPU setup. Edit pytorch-cuda version to match your driver (check with
# `nvidia-smi`, top-right corner shows max supported CUDA version).
# Use with: conda env create -f environment-gpu.yml   (or mamba, much faster solver)
name: samvedna_testing
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - ffmpeg
  - pytorch>=2.6
  - torchvision
  - pytorch-cuda=12.4        # change to 12.1 / 11.8 if your driver is older
  - pip:
      - transformers>=4.49.0
      - huggingface_hub>=0.27.0
      - accelerate>=0.34.0
      - librosa>=0.10.1
      - soundfile>=0.12.1
      - moviepy>=2.2.1
      - numpy>=1.26.0
      - pandas>=2.2.0
      - scikit-learn>=1.5.0
      - matplotlib>=3.9.0
      - seaborn>=0.13.0
      - tqdm>=4.66.0
